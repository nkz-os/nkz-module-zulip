# DO NOT commit with real values. This is a template.
# Create the secret zulip-secret in the target namespace (out of band, e.g. sealed)
# with these keys:
#   db-password, rabbitmq-user (zulip), rabbitmq-password,
#   secret-key (long random string), oidc-client-secret (from Keycloak)
#
# To generate a secret key:
#   python3 -c "import secrets; print(secrets.token_hex(32))"
#
apiVersion: v1
kind: Secret
metadata:
  name: zulip-secret
  namespace: nekazari
  labels:
    app: zulip
type: Opaque
stringData:
  db-password: "CHANGE_ME"
  rabbitmq-user: "zulip"
  rabbitmq-password: "CHANGE_ME"
  secret-key: "CHANGE_ME_LONG_RANDOM_STRING"
  oidc-client-secret: "FROM_KEYCLOAK"
