name: Build Provisioner

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/build-provisioner.yml'
  workflow_dispatch:

permissions:
  packages: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ghcr.io/nkz-os/nkz-module-zulip/provisioner:latest
            ghcr.io/nkz-os/nkz-module-zulip/provisioner:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
